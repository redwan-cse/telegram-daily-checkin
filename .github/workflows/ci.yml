name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency and syntax
        run: |
          python -m pip check
          python -m compileall -q telegram_daily_checkin.py tests
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker build -t telegram-daily-checkin:ci .
      - name: Check image dependencies
        run: docker run --rm --network none --entrypoint python telegram-daily-checkin:ci -m pip check
      - name: Smoke test image with a private host-owned volume
        run: |
          mkdir -p "$RUNNER_TEMP/checkin-data"
          chmod 700 "$RUNNER_TEMP/checkin-data"
          sudo chown 12345:12345 "$RUNNER_TEMP/checkin-data"
          docker run --rm --network none --user 12345:12345 \
            --mount "type=bind,source=$RUNNER_TEMP/checkin-data,target=/app/data" \
            --entrypoint python telegram-daily-checkin:ci -c '
          from pathlib import Path
          import cryptography
          from cryptography.fernet import Fernet
          from telegram_daily_checkin import EncryptedSessionStore
          assert tuple(map(int, cryptography.__version__.split("."))) >= (49, 0, 0)
          store = EncryptedSessionStore(Path("/app/data/smoke.sqlite3"), Fernet.generate_key().decode())
          store.save_session("ci", "synthetic-session")
          assert store.get_session("ci") == "synthetic-session"
          print("Docker import, host UID permissions, and encrypted session smoke test passed")
          '
